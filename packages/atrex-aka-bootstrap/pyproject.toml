[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atrex-aka-bootstrap"
version = "0.1.0"
description = "AKA generic profile-selected startup host"
requires-python = ">=3.10"
dependencies = ["atrex-aka-core==0.1.0", "atrex-aka-contracts==0.1.0"]

[project.entry-points."aka.commands"]
run = "aka.bootstrap.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aka.bootstrap", "aka.bootstrap.*"]
